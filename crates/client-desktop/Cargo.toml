[package]
name = "shut-remote"
version = "0.1.0"
edition = "2024"
description = "Native desktop remote client for Shut"
license = "MIT OR Apache-2.0"

[dependencies]
dioxus = { version = "=0.7.10", features = ["desktop"] }
dirs = "7"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shut-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["time"] }
ureq = { version = "3", features = ["json"] }
