[package]
name = "shut"
version = "0.3.0"
edition = "2024"

[workspace]
members = ["crates/protocol"]
# client-desktop は単一アプリへ統合済み（レガシー参照用に残す）
exclude = ["crates/client-desktop", "android"]

[dependencies]
shut-protocol = { path = "crates/protocol" }
arboard = "3.6.3"
argon2 = "0.5.3"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
chrono = "0.4.45"
dioxus = { version = "=0.7.10", features = ["desktop"] }
dirs = "7.0.0"
futures-util = "0.3.31"
image = "0.24.9"
qrcode = "0.14.1"
rand = "0.10.3"
rayon = "1.11"
rfd = "0.15"
screenshots = "0.8.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tungstenite = "0.28"
ureq = { version = "3", features = ["json"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
